# Jockeys, as in vanilla: right-click a mount to ride it, steer it with your movement keys, jump to jump, sneak to get
# off. A spider you push into a wall climbs it; a chicken glides down. The mount's own mind is switched off while you
# ride. Mount -> the morphs that can ride it; "baby " in front means only that mob's baby form. Needs morphreborn.ability
# (and, in Survival, the Morph Abilities upgrade).
jockeys:
  spider: [skeleton, stray, wither_skeleton, bogged, parched]
  cave_spider: [skeleton, stray, wither_skeleton, bogged, parched]
  chicken: [baby zombie, baby husk, baby drowned, baby zombie_villager, baby zombified_piglin, baby piglin]
  hoglin: [baby piglin]
