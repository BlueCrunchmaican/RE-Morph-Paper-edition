# RE:Morph - server configuration
# Every option is read on startup and on /morph reload.

# The RE:Morph release this file's layout comes from; don't change it. When a newer release adds settings, it updates
# this file on startup: new settings appear with their defaults and comments, and every value you set is kept. Your
# old file stays next to it (named like config-old-6.1.4.yml).
config-version: 7.1.0

# classic:  the original Morph. Kill a creature to unlock it as a morph.
# survival: iChun's planned "Default Mode". Morphing is earned: unlock the Biomass ability (Wither and Regeneration at
#           the same time), absorb creatures' biomass and spend it on upgrades, including the ability to morph.
#           Settings in survival.yml.
# Change it in game with /morph mode classic|survival (takes effect at once and is saved here), or edit it here and
# run /morph reload. Switching never deletes anything: collections and Survival progress are kept in both modes.
# Switching to survival keeps collections but locks them until the player buys the Morph Ability.
gameplay-mode: classic

morphs:
  # Length of a transformation in ticks (20 ticks = 1 second). The original Morph mod uses 100 (5 seconds).
  # Minimum 20 so the animation can play.
  transition-ticks: 100
  # Kills of one entity type needed before its variant is unlocked. The original mod uses 1.
  required-kills: 1
  # Per-type overrides, e.g. minecraft:wither: 3
  required-kills-per-type: {}
  # Entity types that can never be morphed into. Supports * wildcards, e.g. "somemod:*".
  disabled-types:
  - minecraft:armor_stand
  # Whether baby mobs are unlocked as separate baby variants. If false, babies unlock the adult form.
  allow-baby-morphs: true
  # Allow killing a player to unlock their form.
  allow-player-morphs: true
  # Killing a morphed player unlocks the morph they are currently using (original Morph behaviour).
  steal-morphs-from-players: true
  # Entity types that ignore variants entirely (every kill counts as the same morph).
  single-variant-types: []
  # Allow players to delete morphs from their own collection (Delete key in the selector).
  allow-delete: true
  # Safety cap on variants per entity type in one collection (0 = unlimited).
  max-variants-per-type: 64
  # If true, each entity type needs the permission morphreborn.type.<namespace>.<path> to be used.
  # e.g. morphreborn.type.minecraft.ender_dragon
  per-type-permissions: false
  # Seconds a player must wait between starting two morphs (0 = only "not while already transforming").
  morph-cooldown-seconds: 0

death:
  # Keep your current form after dying and respawning (original Morph behaviour).
  keep-morph-on-death: true
  # Remove the morph you died as from your collection.
  lose-current-morph-on-death: false
  # Wipe the whole collection on death (hardcore-style).
  reset-collection-on-death: false

world-effects:
  # What morph abilities may do to the world. Admins can change these in game: /morph setting <name> <value>
  # on = always, off = never, gamerule = follow the world's mobGriefing gamerule (what the real mob does).
  # Creeper explosions, ghast fireballs and wither skulls breaking blocks.
  explosion-block-damage: gamerule
  # Ghast and blaze fireballs (and creepers with set-fire in abilities.yml) setting blocks alight.
  fire: gamerule
  # A creeper morph dies in its own explosion, like a real creeper (a totem of undying still saves you).
  creeper-explosion-kills-user: true
  # Blocks an enderman morph can pick up: vanilla = only what real endermen take (grass, dirt, sand, gravel, clay,
  # flowers, mushrooms, pumpkins, melons, cactus, TNT, mud, moss, nether nylium/fungus/roots); any = any block that
  # can be broken, except ones holding items or text (chests, furnaces, signs) and two-part blocks (doors, beds).
  enderman-pickup: vanilla
  # A bee morph dies a minute after using its sting, like a real bee (set the delay in abilities.yml).
  bee-sting-kills-user: true

persistence:
  # Restore a player's last form when they log back in.
  persist-current-morph: true
  # How often changed collections are written to disk, in seconds. Changes are also saved on quit and shutdown.
  autosave-seconds: 30

appearance:
  # Name shown above a morphed player (for modded and unmodded viewers alike):
  #   morph  - mob morphs show no name (a name-tagged mob variant shows the mob's own name);
  #            player morphs show the name of the player whose form was copied.
  #   player - always the real player's name.
  #   hidden - no name while morphed.
  name-tags: morph
  # Let vanilla (unmodded) players see their own disguise in third person / as a self-disguise.
  vanilla-self-disguise: true
  # Scale the player's hitbox and eye height to the morph, eased over the transition like the original.
  hitbox-scaling: true
  min-scale: 0.2
  # 7.0 fits the biggest mobs at their real size (giant 6.7, ender dragon 4.4, ghast 2.2).
  max-scale: 7.0
  # Shrink/swap/grow animation and particles that unmodded clients see during a transformation.
  vanilla-transition: true
  # Particles and trails unmodded clients see when someone unlocks a morph.
  vanilla-acquisition-effects: true
  # Sound played half-way through a transformation. "morphreborn:morph" comes from the optional resource
  # pack (resourcepack/ in the download) and from the Fabric mod; unmodded clients without the pack hear
  # the fallback instead.
  morph-sound: morphreborn:morph
  morph-sound-fallback: minecraft:entity.illusioner.mirror_move
  morph-sound-volume: 1.0
  # Send the custom sound to unmodded players (only enable if your server resource pack contains it).
  vanilla-clients-have-sound-pack: false

attributes:
  # Copy the morph's attributes onto the player, eased over the transition (original Morph behaviour).
  # Format: attribute key -> { direction: more|less, cap: number (optional) }
  # "more" with a cap means the player gets min(mob value, cap); "less" means max(mob value, cap).
  enabled: true
  list:
    minecraft:max_health:
      direction: more
      cap: 20
    minecraft:knockback_resistance:
      direction: more
    minecraft:movement_speed:
      direction: more
      cap: 0.1
    minecraft:attack_damage:
      direction: more
    minecraft:attack_knockback:
      direction: more
    minecraft:armor:
      direction: more
    minecraft:step_height:
      direction: more
      cap: 1.0
    minecraft:jump_strength:
      direction: more
      cap: 0.7
  # No morph gets less max health than this (small slimes and magma cubes have half a heart in vanilla).
  min-max-health: 4
  # Exact max health for these morphs. The creaking has 1 health in vanilla but can't be hurt while its heart lives.
  health-overrides:
    minecraft:creaking: 20

selector:
  # Allow players to open the selector / pick morphs at all (admins can still force morphs).
  enabled: true
  # Players without the client mod can use /morph to pick morphs.
  allow-commands-for-vanilla: true

trading:
  # Players can trade with a player morphed as a villager, as with a real villager: its profession and level decide
  # the trades, each has limited uses and they restock every Minecraft day, and what the buyer pays is used up.
  # In game: /morph setting villager-trading true|false
  villagers: true
  # Hold the villager player in place while someone trades with them. In game: /morph setting freeze-trading true|false
  freeze-villager: false

client:
  # Message shown to players whose client mod speaks an older protocol.
  outdated-message: "<yellow>Your RE:Morph client mod is outdated; update it to use the morph selector."
  # Broadcast "<player> unlocked <morph>" style messages to the unlocking player in chat (Fabric players get a toast).
  unlock-chat-message: true
  # Told to players whose client mod is older than this plugin when they join (it still works, it just misses the
  # newest features). {client} and {server} are the two versions. "" turns it off.
  old-client-message: "<yellow>Your RE:Morph client mod is {client}; this server runs {server}. Get the newest client mod for everything the server offers: <click:open_url:'https://modrinth.com/plugin/re-morph'><hover:show_text:'https://modrinth.com/plugin/re-morph'><aqua>[Modrinth]</aqua></hover></click> <click:open_url:'https://github.com/BlueCrunchmaican/RE-Morph-Paper-edition/releases/latest'><hover:show_text:'https://github.com/BlueCrunchmaican/RE-Morph-Paper-edition/releases/latest'><aqua>[GitHub]</aqua></hover></click>"

multimorph:
  # Players may combine two morphs: a main body, and a second form it borrows from. With the client mod, hold Shift when
  # picking in the selector or the favourites wheel; without it, /morph combine <main> <borrowed>. In Survival it needs
  # the Multimorph upgrade, and costs both forms' prices plus morph-cost.multimorph-extra (survival.yml). Needs the
  # morphreborn.multimorph permission (everyone by default).
  enabled: true
  # Players without the client mod see a multimorph as its main body with the borrowed creature's head on it, at that
  # creature's real size. The heads come from RE:Morph's resource pack (RE-Morph-pack.zip). Bodies that wear things on
  # their head (zombies, skeletons, piglins, villagers, illagers, players...) wear the borrowed creature's skull
  # instead when the game has one (zombie, skeleton, wither skeleton, creeper, piglin, dragon, player), and skulls
  # also stand in for the pack's heads for players without it.
  #   auto - shown to players whose game loaded the server's resource pack
  #   pack - shown to everyone (when the server requires the pack)
  #   off  - never
  vanilla-heads: auto

conversions:
  # A morph changes the way its creature does in vanilla, for as long as you keep that body. The selector, your
  # collection and your saved morph keep the form you picked; a new form, a respawn or logging out ends it. Multimorphs
  # don't convert.
  enabled: true
  # A villager killed by a zombie becomes a zombie villager: never on Easy, half the time on Normal, always on Hard.
  zombie-villager: true
  # A zombie villager with Weakness, fed a golden apple (by another player, or eating one itself), shakes for a while and
  # turns back into a villager.
  curing: true
  # A zombie (or zombie villager) under water for 30 seconds drowns into a drowned, 15 seconds later; a husk into a
  # zombie.
  drowning: true
  # A skeleton stuck in powder snow for 7 seconds becomes a stray, 15 seconds later.
  freezing: true
  # Piglins, piglin brutes and hoglins outside the Nether shake for 15 seconds and zombify.
  zombification: true
  # Lightning turns a pig into a zombified piglin and a villager into a witch, and flips a mooshroom's colour. (It
  # charges a creeper: abilities.yml, explode.)
  lightning: true
  # A sulfur cube takes a block when another player right-clicks it with one (only blocks sulfur cubes take); TNT
  # makes it explosive, and exploding spends it.
  sulfur-cube: true
  # How long a cure takes (vanilla: 3 to 5 minutes).
  cure-seconds: 180
  # How long the change itself takes, in ticks: a short transformation.
  transformation-ticks: 40

# Ask GitHub at startup and every 12 hours whether a newer RE:Morph release is out. If one is, the console says so and
# players with morphreborn.admin are told when they join. Only the public "latest release" page is requested.
update-check:
  enabled: true

debug: false
