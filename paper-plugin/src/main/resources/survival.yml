# What the biomass passives cost (8.0.0), by upgrade id. A passive uses no biomass until it acts (2026-11-16). Each
# one is billed one of three ways (billing:):
#   triggered: free until it acts, then a price for each thing it does.
#   acting:    drains only in the runs (every half second) in which it is doing something.
#   constant:  drains the whole time it is on (Borrowed Scent: while a creature is combined with you, your own body with one
#              lent to it or one with your own head; in your own body, or a morph of creatures alone, which is Camouflage's,
#              or with a creature that never targets players, like a cow, it does nothing and costs nothing).
# Only Night Eyes, Tendril Sense and Borrowed Scent can be switched between acting and constant ("billing: constant"); for
# the others the kind is how they work. Prices are biomass: drain-per-minute, per-second (Gills and Fire Shedding), per-food-point
# and per-saturation (Sustenance: what it costs to fill one point of hunger, and one point of saturation alongside; a full
# stomach costs nothing), per-effect (Antitoxin), per-item (Scavenger; the reach is by level, the upgrade's value).
# With too little biomass to pay, a passive doesn't act and nothing is spent: the fire burns, the poison poisons.
# These are also the built-in defaults, so an old file without them still bills. An entry with no billing: is the older
# layout (a drain a minute for everything) and is ignored for the defaults.
passives:
  passive_sustenance: { billing: acting, per-food-point: 2, per-saturation: 0.5, saturation-floor: 5 }
  # In the dark: effective light at the eyes of dark-light-level or less (the night and thunderstorms count against the sky
  # light), and light again at 3 above that; it holds an answer at least 5 seconds so a torch's edge doesn't flicker.
  passive_night_eyes: { billing: acting, drain-per-minute: 1.5, dark-light-level: 6 }
  passive_gills: { billing: acting, per-second: 0.15 }
  passive_fire_shedding: { billing: triggered, per-second: 0.5 }
  passive_antitoxin: { billing: triggered, per-effect: 1 }
  # radius: blocks; acting means only while a creature is in range.
  passive_tendril_sense: { billing: acting, drain-per-minute: 30, radius: 24 }
  passive_scavenger: { billing: triggered, per-item: 0.05, reach: [6, 10, 16] }
  passive_borrowed_scent: { billing: constant, drain-per-minute: 6 }
